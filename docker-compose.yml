services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - neuroshield_mongo:/data/db
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file: .env.example
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend
volumes:
  neuroshield_mongo:
